name: distortion
version: '${version}'

main: io.github.ratr2.distortion.Distortion
api-version: '26.3'
load: POSTWORLD

# /distortion itself is registered with Brigadier in Distortion.onEnable.
permissions:
  distortion.spawn:
    description: Allows /distortion spawn.
    default: op
  distortion.reload:
    description: Allows /distortion reload.
    default: op
  distortion.debug:
    description: Allows /distortion debug.
    default: op
